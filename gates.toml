# gX gate manifest — source of truth for audit gates and --changed planning.
# Generated from the v0.26.0 audit_summary gate list; edit deliberately.

[defaults]
cache = "content"
timeout = 1200
retries = 1
build_inputs = [
  "src/",
  "resources/",
  "scripts/",
  "cmake/",
  "CMakeLists.txt",
  "Makefile",
  "patches/",
  "modules/",
  "external/raylib/",
]

[shared]
files = [
  "scripts/audit_common.py",
  "scripts/audit_cache.py",
  "scripts/gate_manifest.py",
  "scripts/gates.py",
  "gates.toml",
]

[groups.render]
inputs = [
  "src/renderer/",
  "resources/shader/",
  "resources/tools/",
  "src/common/",
]

[groups.water]
inputs = [
  "src/renderer/",
  "resources/shader/",
  "resources/tools/",
  "src/common/",
]

[groups.gui]
inputs = [
  "src/gui/",
  "src/tools/gfx/",
  "resources/font/",
  "resources/tools/",
  "src/common/",
]

[groups.audio]
inputs = [
  "src/audio/",
  "resources/audio/",
  "src/common/",
]

[groups.physics]
inputs = [
  "src/physics/",
  "src/common/",
]

[groups.scripting]
inputs = [
  "src/scripting/",
  "modules/",
  "src/common/",
]

[groups.tooling]
inputs = [
  "scripts/audit_",
  "scripts/gates.py",
  "gates.toml",
]

